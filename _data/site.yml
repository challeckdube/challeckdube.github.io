biography_html: |
  In Spring 2026, I completed my PhD at UC Berkeley under <a href="https://math.berkeley.edu/~swshin/">Sug Woo Shin</a>.
  During the 2026-2027 academic year, I will be visiting as a postdoctoral fellow at the <a href="https://www.mpim-bonn.mpg.de/">Max Planck Institute for Mathematics</a>, mentored by <a href="https://www.math.uni-bonn.de/people/kaletha/">Tasho Kaletha</a>.
  Beginning in 2027, I will be a Griffiths Assistant Professor at <a href="https://math.duke.edu/">Duke University</a>.
